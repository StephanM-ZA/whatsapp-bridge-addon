name: Auto-release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-and-tag:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump add-on version (patch)
        id: bump
        run: |
          FILE=whatsapp_status_bridge/config.yaml
          CURRENT=$(grep -oP '(?<=^version: ")[^"]+' "$FILE")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s/^version: \".*\"/version: \"$NEW\"/" "$FILE"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add whatsapp_status_bridge/config.yaml
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_version }} [skip release]"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.new_version }}"
